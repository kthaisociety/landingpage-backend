name: CI & Dev Deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy-dev:
    needs: test
    # Deploy every tested push to main, including release-please commits. Release
    # commits only bump version/CHANGELOG, and excluding them would let the
    # head-of-main freshness check below skip the previous commit with nothing
    # replacing it, leaving dev on older code.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Serialize dev publishing/deploys so out-of-order runs cannot leave :staging on an older commit.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lower-case image name
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push only the immutable per-commit tag; :staging is promoted separately below.
      - name: Build and push image (sha tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      # Checked after the build so a newer push to main during the build is detected.
      # Prevents older runs (or re-runs) from moving :staging backwards.
      - name: Check commit is still the head of main
        id: fresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" -q .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::warning::main moved to $head; skipping stale deploy of $GITHUB_SHA"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote sha image to :staging
        if: steps.fresh.outputs.stale == 'false'
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:staging" \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}"

      - name: Deploy to Dokploy Dev Environment
        if: steps.fresh.outputs.stale == 'false'
        run: |
          curl --fail-with-body -X POST "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ secrets.DOKPLOY_DEV_APP_ID }}\"}"
