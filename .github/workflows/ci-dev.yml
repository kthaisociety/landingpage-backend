name: CI & Dev Deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy-dev:
    needs: test
    # Only deploy to dev if this is a push to main (and NOT a release-please commit)
    if: >
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'chore(main): release') &&
      !contains(github.event.head_commit.message, 'release-please')
    runs-on: ubuntu-latest
    # Serialize dev publishing/deploys so out-of-order runs cannot leave :staging on an older commit.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Skip stale deployment
        id: fresh
        run: |
          latest=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "main moved to $latest; skipping stale deploy of $GITHUB_SHA"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set lower-case image name
        if: steps.fresh.outputs.stale == 'false'
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        if: steps.fresh.outputs.stale == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.fresh.outputs.stale == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Staging image
        if: steps.fresh.outputs.stale == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Deploy to Dokploy Dev Environment
        if: steps.fresh.outputs.stale == 'false'
        run: |
          curl --fail-with-body -X POST "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ secrets.DOKPLOY_DEV_APP_ID }}\"}"
