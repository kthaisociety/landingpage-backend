# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    # Integration tests need real backing services:
    # - Redis: the rate limiter's tests (internal/middleware) skip without one.
    # - Postgres: the migration regression test asserts that AutoMigrate keeps
    #   the Registration/User foreign key on registrations, which only
    #   reproduces against a live server.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kthais
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -v ./...

    - name: Check formatting
      run: |
        if [ -n "$(gofmt -d -s .)" ]; then
          gofmt -d -s .
          exit 1
        fi

    - name: Test
      env:
        MIGRATION_TEST_DSN: host=localhost user=postgres password=postgres dbname=kthais port=5432 sslmode=disable
      run: go test -v ./...
